[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-science-chemical-engineering"
version = "1.0.0"
description = "Data Science in Chemical Engineering - Educational Repository"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Riccardo Caraccio", email="riccardo.caraccio@polimi.it"},
    {name = "Timoteo Dinelli", email="timoteo.dinelli@polimi.it"},
    {name = "Alessandro Stagni", email="alessandro.stagni@polimi.it"}
]
keywords = [
    "data-science",
    "machine-learning",
    "deep-learning",
    "chemical-engineering",
    "pytorch",
    "education"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Education",
]

dependencies = [
    # Core scientific computing
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "sympy>=1.12",

    # Data manipulation and analysis
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",  # For Excel file support

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",

    # Machine learning
    "scikit-learn>=1.3.0",

    # Deep learning - PyTorch ecosystem
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",

    # Computer vision
    "opencv-python>=4.8.0",

    # Jupyter and interactive computing
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "notebook>=7.0.0",
    "ipykernel>=6.25.0",
    "ipywidgets>=8.1.0",

    # Additional utilities for notebooks
    "nbformat>=5.9.0",
    "nbconvert>=7.8.0",

    # Pinn
    "torch>=2.0.0",
    "pyDOE>=0.3.8",  # Design of experiments for sampling
]


[project.urls]
Homepage = "https://github.com/Riccaraccio/Data-Science"
Repository = "https://github.com/Riccaraccio/Data-Science"
Documentation = "https://github.com/Riccaraccio/Data-Science/blob/main/README.md"
"Bug Tracker" = "https://github.com/Riccaraccio/Data-Science/issues"

[tool.setuptools]
packages = ["practicals"]

[tool.setuptools.package-data]
"*" = ["*.csv", "*.dat", "*.npy", "*.mp4", "*.jpg", "*.xlsx"]
